<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#022c22"/>
    </radialGradient>
    <linearGradient id="fireGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="40%" stop-color="#ea580c"/>
      <stop offset="80%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield / Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Outer Ring Accent -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#10b981" stroke-width="6" opacity="0.4" />

  <!-- Borneo Rainforest Trees Silhouette in Background -->
  <path d="M60 410 L110 320 L160 410 Z" fill="#047857" opacity="0.6"/>
  <path d="M130 420 L190 300 L250 420 Z" fill="#059669" opacity="0.7"/>
  <path d="M350 420 L410 310 L470 420 Z" fill="#047857" opacity="0.6"/>
  <path d="M290 430 L340 330 L390 430 Z" fill="#059669" opacity="0.7"/>

  <!-- Wildfire Flame (Bottom-Center) -->
  <path d="M256 120 C220 180 200 240 200 290 C200 350 225 390 256 400 C287 390 312 350 312 290 C312 240 292 180 256 120 Z" fill="url(#fireGrad)" filter="url(#glow)"/>
  <path d="M256 210 C242 250 230 280 230 310 C230 350 245 375 256 380 C267 375 282 350 282 310 C282 280 270 250 256 210 Z" fill="#fef08a"/>

  <!-- Water Jet Extinguishing Arc -->
  <path d="M120 380 Q 200 160 256 230" fill="none" stroke="url(#waterGrad)" stroke-width="20" stroke-linecap="round"/>
  <circle cx="256" cy="230" r="14" fill="#bae6fd" filter="url(#glow)"/>
  <circle cx="240" cy="205" r="8" fill="#e0f2fe"/>
  <circle cx="270" cy="215" r="10" fill="#e0f2fe"/>
  <circle cx="215" cy="245" r="7" fill="#7dd3fc"/>

  <!-- Rescue Star / Borneo Shield Emblem -->
  <g transform="translate(256, 100) scale(0.9)">
    <circle cx="0" cy="0" r="44" fill="#059669" stroke="#34d399" stroke-width="4"/>
    <!-- Firefighter Helmet / Shield Icon -->
    <path d="M-22 6 Q 0 -24 22 6 L 16 18 Q 0 14 -16 18 Z" fill="#fbbf24"/>
    <circle cx="0" cy="2" r="5" fill="#ffffff"/>
  </g>

  <!-- Title Ribbon -->
  <rect x="86" y="420" width="340" height="46" rx="23" fill="#064e3b" stroke="#34d399" stroke-width="3"/>
  <text x="256" y="452" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="900" fill="#facc15" letter-spacing="3">FIRELAND</text>
</svg>
